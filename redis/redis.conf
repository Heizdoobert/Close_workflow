# Redis persistence configuration
# Enable AOF (Append Only File) for durability
appendonly yes
appendfilename "appendonly.aof"
# Save snapshots every 60 seconds if at least 1000 keys changed
save 60 1000
# Disable RDB snapshotting if you prefer AOF only (comment out if not needed)
# save ""
# Set a reasonable maxmemory policy (optional)
maxmemory 256mb
maxmemory-policy allkeys-lru
