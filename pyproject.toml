[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-engine"
version = "0.5.0"
description = "Closed-loop task engine: Redis queue, cheap claude -p worker, scripted gates, Loki/Grafana logs"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
flow-task = "flow_engine.cli:main"

[tool.setuptools]
packages = ["flow_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
