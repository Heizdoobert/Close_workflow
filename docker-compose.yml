services:
  redis:
    image: redis:7-alpine
    command: ["redis-server","/usr/local/etc/redis/redis.conf","--requirepass","${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    container_name: flow_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  redis_data: