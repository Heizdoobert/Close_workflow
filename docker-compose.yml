services:
  redis:
    image: redis:7-alpine
    command: ["redis-server","/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    container_name: flow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  redis_data: